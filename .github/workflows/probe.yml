name: Diagnose KGMA public updates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['qa/live_probe.py', '.github/workflows/probe.yml']
  workflow_run:
    workflows: ['Publish KGMA dashboard']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    if: github.event.repository.private == false && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('collector/requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - run: python -u qa/live_probe.py
