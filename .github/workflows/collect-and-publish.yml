name: Collect KGMA votes and publish

on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'dist/data/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kgma-collector-and-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      collector_ok: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Preserve snapshots saved after an earlier attempt of this workflow.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('collector/requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: Read public rankings
        id: collect
        continue-on-error: true
        env:
          COLLECT_UNTIL: ${{ vars.COLLECT_UNTIL }}
        run: python collector/collect.py
      - name: Preserve records and collector status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data/history.json dist/data/seed.js
          if ! git diff --cached --quiet; then
            git commit -m 'Update observed KGMA ranking records'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        if: steps.collect.outcome == 'failure'
        with:
          name: collector-diagnostics
          path: collector/debug
          if-no-files-found: ignore
          retention-days: 3
  publish:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Surface collector failure after publishing the last valid record
        if: needs.collect.outputs.collector_ok == 'failure'
        run: |
          echo 'Collector failed. The last valid record and its error status were published.'
          exit 1
