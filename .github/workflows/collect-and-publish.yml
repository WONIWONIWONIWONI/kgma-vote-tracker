name: Collect KGMA votes continuously

on:
  workflow_dispatch:
  # Keep one successor queued while the current job checks every five minutes.
  # New scheduled runs replace only the pending run, never the active collector.
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - '.github/workflows/collect-and-publish.yml'

permissions:
  contents: write

concurrency:
  group: kgma-collector-and-pages
  cancel-in-progress: false

jobs:
  collect:
    # This project is intended to use free standard public-repository runners only.
    if: github.event.repository.private == false && vars.COLLECT_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('collector/requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: Verify collector
        run: python -m unittest discover -s collector -p 'test_*.py'
      - name: Configure record commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Collect and save every five minutes for up to 5.5 hours
        env:
          COLLECT_UNTIL: ${{ vars.COLLECT_UNTIL }}
        run: python -u collector/runner.py --minutes 330
