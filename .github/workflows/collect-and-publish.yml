name: Collect KGMA votes continuously

on:
  workflow_dispatch:
  # Keep one successor queued while the current job checks every five minutes.
  # New scheduled runs replace only the pending run, never the active collector.
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - '.github/workflows/collect-and-publish.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: kgma-collector-and-pages
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  collect:
    # This project is intended to use free standard public-repository runners only.
    if: github.event.repository.private == false && vars.COLLECT_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      COLLECT_UNTIL: ${{ vars.COLLECT_UNTIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify collector
        run: python -m unittest discover -s collector -p 'test_*.py'
      - name: Configure record commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Read the public API on each update and retry briefly while waiting
        run: python -u collector/runner.py --minutes 330
      - name: Disable future schedules after the two-week window
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python collector/lifecycle.py
