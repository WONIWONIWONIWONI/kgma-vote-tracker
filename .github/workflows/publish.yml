name: Publish KGMA dashboard # RESCENE gap deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dist/index.html'
      - 'dist/app.js'
      - 'dist/candles.js'
      - 'dist/hourly.js'
      - 'dist/axis.js'
      - 'dist/exports.js'
      - 'dist/style.css'
      - 'dist/favicon.svg'
      - '.github/workflows/publish.yml'
      - 'collector/prepare_site.py'
      - 'collector/policy.py'
      - 'qa/check_layout.py'
      - 'qa/test_hourly.cjs'
      - 'qa/test_axis.cjs'

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: kgma-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare compact fallback and enforce size ceiling
        run: python collector/prepare_site.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('collector/requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: Verify chart axes and hourly calculations
        run: |
          node qa/test_axis.cjs
          node qa/test_hourly.cjs
      - name: Verify mobile widths, hourly bars, and exports
        run: python -u qa/check_layout.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Remove the temporary artifact after successful deployment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' |
          while read -r artifact_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
